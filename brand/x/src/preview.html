<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
  body{margin:0;background:#000;font-family:Inter;color:#E7E9EA}
  .col{width:600px;border-left:1px solid #2F3336;border-right:1px solid #2F3336;margin:0 auto;min-height:420px}
  .hdr{width:600px;height:200px;background:url(../forgeai-x-header-3000x1000.png) center/cover}
  .av{width:134px;height:134px;border-radius:50%;border:4px solid #000;margin:-71px 0 0 16px;background:url(../forgeai-x-logo-800.png) center/cover;position:relative}
  .name{padding:12px 16px 0;font-weight:800;font-size:20px}
  .handle{padding:0 16px;color:#71767B;font-size:15px}
  .bio{padding:12px 16px;font-size:15px;line-height:20px}
  .small{display:flex;gap:12px;align-items:center;padding:8px 16px 16px;color:#71767B;font-size:13px}
  .small i{width:40px;height:40px;border-radius:50%;background:url(../forgeai-x-logo-800.png) center/cover;display:block}
</style></head>
<body><div class="col">
  <div class="hdr"></div><div class="av"></div>
  <div class="name">FORGEAI</div><div class="handle">@forgeai</div>
  <div class="bio">An environment for autonomous agents. Build. Train. Deploy.</div>
  <div class="small"><i></i> avatar at timeline size</div>
</div></body></html>
