<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #111111; }
  svg { display: block; }
</style>
</head>
<body>
<!-- X profile image, 400 x 400. X crops it to a circle; the mark sits well inside that circle. -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse" x="3" y="3">
      <path d="M22 0H0V22" fill="none" stroke="#171717" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6A1A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#111111"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Mark: 20 x 20 units, 11px per unit, nudged 3px right and down for optical balance -->
  <g transform="translate(93 93)">
    <rect x="0"   y="0"   width="220" height="55"  fill="#ECECEC"/>
    <rect x="0"   y="77"  width="55"  height="143" fill="#ECECEC"/>
    <rect x="77"  y="77"  width="110" height="55"  fill="#A3A3A3"/>
    <rect x="77"  y="154" width="66"  height="66"  fill="#FF6A1A"/>
  </g>
</svg>
</body>
</html>
